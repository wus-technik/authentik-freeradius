        - !Context ssid
        - !Context radius_server_name
        - !Context password_manager
  - model: authentik_stages_prompt.prompt
    id: prompt-ack
    identifiers:
      name: wlan-passwort-bestaetigung
    attrs:
      field_key: wifi_ack
      label: Ich habe das Passwort gespeichert. Mein bisheriges WLAN-Passwort wird damit ungültig.
      type: checkbox
      required: true
      order: 2
  - model: authentik_stages_prompt.promptstage
    id: stage-prompt
    identifiers:
      name: wlan-passwort-anzeige
    attrs:
      fields:
        - !KeyOf prompt-password
        - !KeyOf prompt-info
        - !KeyOf prompt-ack
      validation_policies:
        - !KeyOf policy-save
  - model: authentik_flows.flow
    id: flow-wlan
    identifiers:
      slug: wlan-passwort
    attrs:
      name: WLAN-Passwort
      title: WLAN-Passwort
      designation: stage_configuration
      authentication: require_authenticated
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flow-wlan
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, !Context wlan_group]]
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-wlan
      stage: !KeyOf stage-prompt
      order: 10

  # --- Portal tile (spec 5.4) ----------------------------------------------
  - model: authentik_core.application
    id: app-wlan
    identifiers:
      slug: wlan-zugang
    attrs:
      name: WLAN-Zugang
      meta_launch_url: !Format
        - "%s/if/flow/wlan-passwort/"
        - !Context authentik_url
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-wlan
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, !Context wlan_group]]

  # --- LDAP for FreeRADIUS (spec 5.5) --------------------------------------
  - model: authentik_stages_identification.identificationstage
    id: ldap-ident
    identifiers:
      name: wlan-ldap-identification
    attrs:
      user_fields: [username]
  - model: authentik_stages_password.passwordstage
    id: ldap-password
    identifiers:
      name: wlan-ldap-password
    attrs:
      # The service account binds with its app-password token.
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.core.auth.TokenBackend
  - model: authentik_stages_user_login.userloginstage
    id: ldap-login
    identifiers:
      name: wlan-ldap-login
  - model: authentik_flows.flow
    id: flow-ldap-bind
    identifiers:
      slug: wlan-ldap-bind
    attrs:
      name: WLAN LDAP bind
      title: WLAN LDAP bind
      designation: authentication
      # Only the outpost may run this flow; in a browser it would be a login
      # without the MFA of the regular authentication flow.
      authentication: require_outpost
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-ldap-bind
      stage: !KeyOf ldap-ident
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-ldap-bind
      stage: !KeyOf ldap-password
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-ldap-bind
      stage: !KeyOf ldap-login
      order: 30
  - model: authentik_providers_ldap.ldapprovider
    id: provider-ldap
    identifiers:
      name: wlan-ldap
    attrs:
      authorization_flow: !KeyOf flow-ldap-bind
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      base_dn: !Context ldap_base_dn
      # direct: a deactivation or group change applies to the next login.
      search_mode: direct
      bind_mode: direct
  - model: authentik_core.application
    id: app-ldap
    identifiers:
      slug: wlan-ldap
    attrs:
      name: wlan-ldap
      provider: !KeyOf provider-ldap
  # Only members of this group may bind. Nobody is in it until the service
  # account is added; this provider hands out NT hashes.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-ldap
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, !Context ldap_search_group]]
