name: akfr-e2e

services:
  authentik_radius:
    build: ./backend
    networks: [e2e]

  certgen:
    build: ./client
    volumes:
      - ./certs:/out
    command:
      - sh
      - -c
      - >-
        test -f /out/server.crt ||
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650
        -subj '/CN=radius.e2e.test'
        -keyout /out/server.key -out /out/server.crt

  freeradius:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      authentik_radius:
        condition: service_started
    environment:
      AUTHENTIK_RADIUS_HOST: authentik_radius
      AUTHENTIK_RADIUS_SECRET: e2e-backend-secret-not-a-real-one
      RADIUS_SECRET: e2e-uplink-secret-not-a-real-one
      RADIUS_CLIENT_NET: 172.28.0.0/16
      TLS_CERT_PATH: /certs/server.crt
      TLS_KEY_PATH: /certs/server.key
    volumes:
      - ./certs:/certs:ro
    networks: [e2e]
    # Mirror docker-compose.yml's production hardening so the e2e suite
    # actually exercises it instead of a softer configuration.
    read_only: true
    tmpfs:
      - /run/radiusd
      - /tmp/radiusd
    cap_drop: [ALL]

  client:
    build: ./client
    environment:
      RADIUS_SECRET: e2e-uplink-secret-not-a-real-one
    networks: [e2e]
    entrypoint: ["/auth.sh"]

networks:
  e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
