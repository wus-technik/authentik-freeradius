network={
	ssid="e2e"
	key_mgmt=WPA-EAP
	# Like iOS and macOS without a profile: take what the server offers, and
	# inside the tunnel speak EAP-MSCHAPv2 whether it is PEAP or TTLS.
	eap=TTLS PEAP
	identity="peapuser"
	anonymous_identity="anonymous"
	password="e2e-peap-pw"
	phase2="autheap=MSCHAPV2"
}
