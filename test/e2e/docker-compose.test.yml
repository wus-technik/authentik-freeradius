name: akfr-e2e

services:
  authentik_radius:
    build: ./backend
    environment:
      AUTHENTIK_RADIUS_SECRET: 'e2e-backend-"sec\ret%{User-Name} not-a-real-one'
    networks:
      e2e:
        # Fixed, like in production (issue #15).
        ipv4_address: 172.28.0.10

  authentik_ldap:
    # Stand-in for the authentik LDAP outpost: same DNs, same attribute names.
    build: ./ldap
    networks:
      e2e:
        ipv4_address: 172.28.0.11

  certgen:
    build: ./client
    volumes:
      - ./certs:/out
    command:
      - sh
      - -c
      - >-
        test -f /out/server.crt ||
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650
        -subj '/CN=radius.e2e.test'
        -keyout /out/server.key -out /out/server.crt

  freeradius:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      authentik_radius:
        condition: service_started
    environment:
      AUTHENTIK_RADIUS_HOST: 172.28.0.10
      # The secrets carry a quote, a backslash, an xlat expression and a
      # space: radiusd must use them verbatim (see freeradius/clients.conf).
      AUTHENTIK_RADIUS_SECRET: 'e2e-backend-"sec\ret%{User-Name} not-a-real-one'
      # Two networks, two sites, no RADIUS_SECRET (issue #4). The client
      # container always gets an address from ip_range, so it is in "clients".
      RADIUS_CLIENT_NET: 172.28.0.0/17=infra, 172.28.128.0/17=clients
      RADIUS_SITE_SECRETS: 'infra:e2e-infra-site-secret-not-a-real-one,clients:e2e-uplink-"sec\ret%{User-Name} not-a-real-one'

      TLS_CERT_PATH: /certs/server.crt
      TLS_KEY_PATH: /certs/server.key
      VLAN_MAP: vlan-staff=20
      USERNAME_STRIP_DOMAIN: "true"
      USERNAME_STRIP_NTDOMAIN: "true"
      PEAP_ENABLE: "true"
      LDAP_HOST: 172.28.0.11
      LDAP_BASE_DN: dc=ldap,dc=goauthentik,dc=io
      LDAP_BIND_DN: cn=svc-wlan-ldap,ou=users,dc=ldap,dc=goauthentik,dc=io
      # A quote, a backslash, an xlat expression and a space: the password must
      # reach the LDAP bind verbatim (see the comment in freeradius/peap/ldap).
      LDAP_BIND_PASSWORD: 'e2e-ldap-"bind\n%{User-Name} not-a-real-one'
      LDAP_WLAN_GROUP_DN: cn=wlan,ou=groups,dc=ldap,dc=goauthentik,dc=io
    volumes:
      - ./certs:/certs:ro
    networks: [e2e]
    # Mirror docker-compose.yml's production hardening so the e2e suite
    # actually exercises it instead of a softer configuration.
    read_only: true
    tmpfs:
      - /run/radiusd
      - /tmp/radiusd
    cap_drop: [ALL]
    # Stage "radiusd restarted" and the certificate watcher rely on this.
    restart: unless-stopped

  client:
    build: ./client
    environment:
      RADIUS_SECRET: 'e2e-uplink-"sec\ret%{User-Name} not-a-real-one'
    networks: [e2e]
    entrypoint: ["/auth.sh"]

networks:
  e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          # Dynamic addresses come from the upper half only, so the fixed
          # outpost addresses below it can never be taken.
          ip_range: 172.28.128.0/17
